# ══════════════════════════════════════════════════════════════
# perf-config.yaml — Master Performance Config
#
# This is the ONLY file the dev team needs to edit.
# CI pipeline always reads this file — never needs to change.
#
# HOW TO CONFIGURE SERVICES:
#   services_dir → folder containing per-service configs
#   run_services → which services to run
#                  blank or omit  = run ALL services
#                  list of names  = run only those services
#
# EXAMPLES:
#   run_services:                    ← run ALL services
#   run_services: [booking-service]  ← run one only
#   run_services: [booking-service, user-service]  ← run two
# ══════════════════════════════════════════════════════════════

# Folder containing per-service configs
services_dir: "perf"

# Which services to run — blank means ALL
run_services:
  # - booking-service
   - user-service

# Performance agent service URL
# Set as GitHub Secret: PERF_AGENT_URL
service_url: "http://localhost:8000"
