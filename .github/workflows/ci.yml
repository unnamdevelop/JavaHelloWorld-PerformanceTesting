# ══════════════════════════════════════════════════════════════
# .github/workflows/ci.yml
# Complete CI/CD pipeline for hello-world-java
#
# Pipeline stages:
#   1. Build and compile Java
#   2. Run JUnit unit tests
#   3. Detect if openapi spec changed (for JMX regeneration)
#   4. Run performance tests via perf agent service
#   5. Upload performance report as artifact
#
# Performance tests run ONLY if unit tests pass.
# Pipeline FAILS if SLA thresholds are violated.
# ══════════════════════════════════════════════════════════════

name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      profile:
        description: "Performance test profile"
        default: "baseline"
        type: choice
        options: [baseline, load, stress, spike, soak]
      skip_perf:
        description: "Skip performance tests"
        type: boolean
        default: false

jobs:

  # ── Job 1: Build and Unit Tests ──────────────────────────────────────────────
  unit-tests:
    name: Build and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build and run unit tests
        run: mvn clean test

      - name: Publish unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: target/surefire-reports/
          retention-days: 7

  # ── Job 2: Performance Tests ─────────────────────────────────────────────────
  # Runs ONLY after unit tests pass
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: unit-tests                    # wait for unit tests to pass
    if: |
      needs.unit-tests.result == 'success' &&
      github.event.inputs.skip_perf != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2                 # need previous commit for spec diff

      - name: Set up Python (for pipeline runner)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline runner dependencies
        run: pip install -r requirements-perf.txt

      # ── Detect if OpenAPI spec changed ─────────────────────────────────────
      # This decides: regenerate JMX (slow) or reuse cached JMX (fast)
      - name: Check if spec changed
        id: spec_check
        run: |
          if git diff HEAD~1 --name-only 2>/dev/null | grep -q "openapi.yaml"; then
            echo "SPEC_CHANGED=true"  >> $GITHUB_ENV
            echo "::notice::OpenAPI spec changed — JMX will be regenerated"
          else
            echo "SPEC_CHANGED=false" >> $GITHUB_ENV
            echo "::notice::Spec unchanged — reusing cached JMX (fast path)"
          fi

      # ── Run performance tests ───────────────────────────────────────────────
      # PERF_AGENT_URL → set in GitHub Secrets (your ngrok or server URL)
      # API_AUTH_PASSWORD → set in GitHub Secrets
      - name: Run performance tests
        id: perf_run
        env:
          PERF_AGENT_URL    : ${{ secrets.PERF_AGENT_URL }}
          API_AUTH_PASSWORD : ${{ secrets.API_AUTH_PASSWORD }}
        run: |
          python pipeline_runner.py \
            --config perf-config.yaml \
            --profile ${{ inputs.profile || 'baseline' }} \
            ${{ env.SPEC_CHANGED == 'true' && '--force-regenerate' || '' }}

      # ── Upload performance report ───────────────────────────────────────────
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-${{ github.run_number }}
          path: perf-results/
          retention-days: 30

      # ── Add report summary to GitHub Actions summary page ──────────────────
      - name: Add to job summary
        if: always()
        run: |
          echo "## Performance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "**Profile:** ${{ inputs.profile || 'baseline' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Spec changed:** ${{ env.SPEC_CHANGED }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ls perf-results/*.md 1>/dev/null 2>&1; then
            echo "### Report" >> $GITHUB_STEP_SUMMARY
            head -40 perf-results/*.md >> $GITHUB_STEP_SUMMARY
          fi

      # ── Comment on PR with results ─────────────────────────────────────────
      - name: Comment performance results on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## Performance Test Results\n\n';
            try {
              const files = fs.readdirSync('perf-results')
                             .filter(f => f.endsWith('.md'));
              if (files.length > 0) {
                const content = fs.readFileSync(
                  `perf-results/${files[0]}`, 'utf8'
                ).slice(0, 2000);
                comment += '```\n' + content + '\n```';
              } else {
                comment += 'No report generated.';
              }
            } catch(e) {
              comment += 'Report not available: ' + e.message;
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner       : context.repo.owner,
              repo        : context.repo.repo,
              body        : comment
            });
