# ══════════════════════════════════════════════════════════════
# .github/workflows/ci.yml
# Complete CI/CD pipeline for hello-world-java
#
# Pipeline stages:
#   1. Build and compile Java
#   2. Run JUnit unit tests
#   3. Detect if openapi spec changed (for JMX regeneration)
#   4. Run performance tests via perf agent service
#   5. Upload performance report as artifact
#
# Performance tests run ONLY if unit tests pass.
# Pipeline FAILS if SLA thresholds are violated.
# ══════════════════════════════════════════════════════════════

name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      profile:
        description: "Performance test profile"
        default: "baseline"
        type: choice
        options: [baseline, load, stress, spike, soak]
      skip_perf:
        description: "Skip performance tests"
        type: boolean
        default: false

jobs:

  # ── Job 1: Build and Unit Tests ──────────────────────────────────────────────
  unit-tests:
    name: Build and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build and run unit tests
        run: mvn clean test

      - name: Publish unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: target/surefire-reports/
          retention-days: 7

      - name: Show test summary in GitHub Actions UI
        if: always()
        run: |
          echo "## Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Count results from surefire XML
          TESTS=$(grep -h "tests=" target/surefire-reports/TEST-*.xml | \
            grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | \
            awk '{sum+=$1} END {print sum}')
          FAILURES=$(grep -h "failures=" target/surefire-reports/TEST-*.xml | \
            grep -o 'failures="[0-9]*"' | grep -o '[0-9]*' | \
            awk '{sum+=$1} END {print sum}')
          ERRORS=$(grep -h "errors=" target/surefire-reports/TEST-*.xml | \
            grep -o 'errors="[0-9]*"' | grep -o '[0-9]*' | \
            awk '{sum+=$1} END {print sum}')

          echo "| Result | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Tests | $TESTS |" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | $((TESTS - FAILURES - ERRORS)) |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | $FAILURES |" >> $GITHUB_STEP_SUMMARY
          echo "| Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Test Cases" >> $GITHUB_STEP_SUMMARY
          echo "| Test Name | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY

          # List each test case
          grep -h "testcase name=" target/surefire-reports/TEST-*.xml | \
            grep -o 'name="[^"]*"' | grep -o '"[^"]*"' | tr -d '"' | \
            while read test; do
              echo "| $test | PASS |" >> $GITHUB_STEP_SUMMARY
            done

  # ── Job 2: Performance Tests ─────────────────────────────────────────────────
  # Runs ONLY after unit tests pass
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: unit-tests                    # wait for unit tests to pass
    if: |
      needs.unit-tests.result == 'success' &&
      github.event.inputs.skip_perf != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2                 # need previous commit for spec diff

      - name: Set up Python (for pipeline runner)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline runner dependencies
        run: pip install -r requirements-perf.txt

      # ── Detect if OpenAPI spec changed ─────────────────────────────────────
      # This decides: regenerate JMX (slow) or reuse cached JMX (fast)
      - name: Check if spec changed
        id: spec_check
        run: |
          if git diff HEAD~1 --name-only 2>/dev/null | grep -q "openapi.yaml"; then
            echo "SPEC_CHANGED=true"  >> $GITHUB_ENV
            echo "::notice::OpenAPI spec changed — JMX will be regenerated"
          else
            echo "SPEC_CHANGED=false" >> $GITHUB_ENV
            echo "::notice::Spec unchanged — reusing cached JMX (fast path)"
          fi

      # ── Run performance tests ───────────────────────────────────────────────
      # Service selection is configured in perf-config.yaml (run_services field)
      # No need to touch this step — devs edit perf-config.yaml instead
      - name: Run performance tests
        id: perf_run
        env:
          PERF_AGENT_URL    : ${{ secrets.PERF_AGENT_URL }}
          API_AUTH_PASSWORD : ${{ secrets.API_AUTH_PASSWORD }}
        run: |
          python pipeline_runner.py \
            --config perf-config.yaml \
            --profile ${{ inputs.profile || 'baseline' }} \
            ${{ env.SPEC_CHANGED == 'true' && '--force-regenerate' || '' }}

      # ── Upload performance report ───────────────────────────────────────────
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-${{ github.run_number }}
          path: perf-results/
          retention-days: 30

      # ── Add rich report summary to GitHub Actions summary page ───────────────
      - name: Add to job summary
        if: always()
        run: |
          # Check if pipeline_runner generated the summary file
          if [ -f "perf-results/github_summary.md" ]; then
            echo "Summary file found — writing to GitHub Step Summary"
            cat perf-results/github_summary.md >> $GITHUB_STEP_SUMMARY

          elif ls perf-results/*.md 1>/dev/null 2>&1; then
            # Fallback — use raw markdown report
            REPORT=$(ls perf-results/*.md | grep -v github_summary | head -1)
            echo "Using raw report: $REPORT"
            echo "## Performance Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat "$REPORT" >> $GITHUB_STEP_SUMMARY

          else
            echo "## Performance Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ No report found. Check the Run performance tests step." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            ls -la perf-results/ 2>/dev/null || echo "perf-results folder missing"
          fi

      # ── Comment on PR with results ─────────────────────────────────────────
      - name: Comment performance results on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## Performance Test Results\n\n';
            try {
              const files = fs.readdirSync('perf-results')
                             .filter(f => f.endsWith('.md'));
              if (files.length > 0) {
                const content = fs.readFileSync(
                  `perf-results/${files[0]}`, 'utf8'
                ).slice(0, 2000);
                comment += '```\n' + content + '\n```';
              } else {
                comment += 'No report generated.';
              }
            } catch(e) {
              comment += 'Report not available: ' + e.message;
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner       : context.repo.owner,
              repo        : context.repo.repo,
              body        : comment
            });
